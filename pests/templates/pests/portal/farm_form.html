{% extends "pests/base.html" %}
{% block content %}
<div class="form-container">
  <h2 class="form-title">Add Farm</h2>

  <form method="post">
    {% csrf_token %}
    <div class="form-fields">
      {{ form.as_p }}
    </div>
    <button type="submit" class="submit-button">Save</button>
  </form>

  <p><a href="{% url 'farm_list' %}">← Back to Farm List</a></p>
</div>
{% endblock %}
