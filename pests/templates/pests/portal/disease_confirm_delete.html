{% extends 'pests/base.html' %}
{% block content %}
<div class="form-container">
  <h2 class="form-title">Confirm Delete Disease</h2>
  <p>Are you sure you want to delete "<strong>{{ object.name }}</strong>"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn-submit">Yes, Delete</button>
    <a href="{% url 'disease_delete_list' %}" class="btn-submit" style="background:#ccc;color:#333;margin-left:1rem;">Cancel</a>
  </form>
</div>
{% endblock %}
